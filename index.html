<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2d42">
<title>Cat World – Życie kota</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1f33;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2b2d42;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.box{background:rgba(255,255,255,.9);border-radius:14px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.small{font-size:12px;opacity:.75}
#hud{display:none;pointer-events:none}
#hud.on{display:block}
#hud .btnp,#hud #mb,#hud #bar,#hud #act,#hud #joy{pointer-events:auto}
#tl{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));min-width:132px;font-size:14px}
.xpb{height:7px;background:#ddd;border-radius:4px;margin-top:4px;overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,#fb8500)}
#mb{position:fixed;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));width:46px;height:40px;font-size:20px;padding:0}
#tr{position:fixed;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));font-size:14px;text-align:right;min-width:110px}
#needs{position:fixed;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 96px);width:124px;padding:6px 8px;background:rgba(255,255,255,.78)}
.nr{display:flex;align-items:center;gap:5px;height:20px;font-size:13px}
.nr span{width:18px;text-align:center}
.nb{flex:1;height:9px;background:rgba(0,0,0,.15);border-radius:5px;overflow:hidden}
.nb i{display:block;height:100%;width:50%;border-radius:5px;transition:width .3s}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;max-width:calc(100vw - 12px);overflow-x:auto;padding:6px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tb{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:#fff;font-size:23px;box-shadow:0 1px 4px rgba(0,0,0,.25);padding:0}
.tb.on{background:#ffd166;outline:3px solid #fb8500}
.tb b{position:absolute;right:-2px;bottom:-2px;background:#2b2d42;color:#fff;font-size:11px;border-radius:9px;padding:1px 5px;font-weight:600}
.chip{flex:0 0 auto;align-self:center;font-size:14px;padding:0 6px;white-space:nowrap}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 74px);font-size:16px;padding:12px 20px;border-radius:26px;background:#06d6a0;color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.35);white-space:nowrap}
#joy{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 76px);width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.55);display:none;touch-action:none}
#joy i{position:absolute;left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3)}
#toasts{position:fixed;left:0;right:0;top:calc(max(8px,env(safe-area-inset-top)) + 54px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:70;pointer-events:none}
.toast{background:rgba(30,32,56,.92);color:#fff;padding:8px 14px;border-radius:14px;font-size:14px;max-width:86vw;text-align:center;animation:ti .25s}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#main{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#ffd6a5,#ffadad 45%,#9b5de5);overflow:auto}
#main.off{display:none}
.mt{text-align:center;padding:20px;width:min(92vw,380px)}
.logo{font-size:64px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.mt h1{margin:0;font-size:42px;letter-spacing:3px;color:#fff;text-shadow:0 3px 0 #7b2cbf}
.mt p{margin:0 0 18px;color:#fff;font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.mbtn{display:block;width:100%;margin:6px 0;padding:11px;border-radius:16px;background:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mbtn:active{transform:translateY(2px)}
.mbtn:disabled{opacity:.45}
#ov{position:fixed;inset:0;z-index:60;background:rgba(15,16,35,.62);display:none;align-items:center;justify-content:center;padding:10px}
#ov.on{display:flex}
.card{background:#fff8ee;border-radius:20px;width:min(100%,600px);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid #f0e0c8;font-size:18px}
.ch b{flex:1;text-align:center}
.ib{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:18px}
#pb{padding:12px 14px 16px;overflow:auto;font-size:15px;touch-action:pan-y}
.btn{padding:10px 14px;border-radius:12px;background:#ffd166;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.5}
.btn.big{display:block;width:100%;margin-top:14px;padding:14px;font-size:17px;background:#06d6a0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid .btn{padding:14px 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #e5d3b8}
.col{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{padding:8px 12px;border-radius:12px;background:#fff;border:2px solid #e5d3b8}
.chp.on{border-color:#fb8500;background:#ffe8c2}
.chp:disabled{opacity:.4}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cdb;padding:0}
.sw.on{box-shadow:0 0 0 3px #fb8500}
.sw:disabled{opacity:.35}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:2px solid #e5d3b8;font:inherit;margin-top:4px;user-select:text;-webkit-user-select:text}
h4{margin:14px 0 6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.tabs .btn{flex:0 0 auto;background:#fff;border:2px solid #e5d3b8}
.tabs .btn.on{background:#ffd166;border-color:#fb8500}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e5d3b8}
.it .ic{font-size:30px;width:40px;text-align:center}
.it .tx{flex:1}
.pg{height:8px;background:#eadcc4;border-radius:5px;margin-top:4px;overflow:hidden}
.pg i{display:block;height:100%;background:#06d6a0}
.dlg{font-size:17px;line-height:1.45;margin:4px 0 14px}
.done{opacity:.55}
.cho .sw{width:30px;height:30px;border-width:2px}.cho .chp{padding:5px 9px;font-size:13px}.cho h4{margin:8px 0 4px}.cho input[type=text]{padding:6px;margin-top:2px}.cho .btn.big{margin-top:8px;padding:10px;font-size:15px}.cho label{font-size:14px}
#main{align-items:flex-start}.mt{margin:auto}
#main,#main *,#ov,#ov *{touch-action:pan-y}
#ov input[type=text]{touch-action:auto}
#main,#pb{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lg{display:block;width:min(100%,300px);max-height:34vh;object-fit:contain;margin:0 auto 4px;image-rendering:pixelated}
.tag1{display:inline-block;margin:0 0 6px;padding:3px 14px;border-radius:12px;background:#2b2d42;color:#ffd166;font-weight:800;letter-spacing:4px;font-size:15px}
.cho{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.cho .pvw{flex:0 0 150px;margin:0 auto}
.cho .ctl{flex:1 1 220px;min-width:200px}
.cho .sw{width:40px;height:40px}
.cho .chp{padding:9px 12px;font-size:14px}
.sub{font-size:12px;opacity:.7;margin-top:4px}
.btns{display:flex;flex-direction:column;gap:4px}
.btns .btn{padding:6px 8px;font-size:13px}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

function tone(f1,f2,dur,type,vol,delay){if(!S.settings.sound)return;const a=audio();if(!a)return;const t=a.currentTime+(delay||0);
 const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);

 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}

function startAct(type,extra){const a=ACT[type];cat.act=Object.assign({type,t:0,dur:a.dur,fx:0},extra||{});cat.tx=null;cat.pending=null;toy.type=null;updateBar();if(type==='sleep'){stat('sleeps');say('💤')}}
function needAct(type,k,max,msg){if(S.needs[k]>max)return toast(msg);startAct(type)}
function wake(){const a=cat.act;if(a&&a.type==='sleep'){cat.act=null;say('Miau? 😺',true)}}
function useIt(it){if(!it)return;if(it.sx!==undefined){cat.x=it.x+it.sx;cat.y=it.y+6;cat.dir=1}cat.pending=null;cat.tx=null;it.run()}
function goTo(it){cat.pending=it;cat.tx=it.x;cat.ty=it.y;cat.chase=false;if(dist(cat.x,cat.y,it.x,it.y)<=it.r)useIt(it)}
function petCat(){if(cat.act&&cat.act.type!=='sleep')return;if(cat.act){fx(cat.x,cat.y-40,'💕',2);return}if(cat.petCool>0)return;cat.petCool=1.2;startAct('pet');sfx('purr')}
function hugCat(){if(cat.act)return;if(cat.petCool>0)return;cat.petCool=2;startAct('hug');sfx('purr')}
function giveTreat(){if(cat.act&&cat.act.type!=='sleep')return;if(!(S.inv.treat>0))return toast('Brak przysmaków – kup w sklepie 🛍️');wake();S.inv.treat--;startAct('treat')}

 if(isNight()){toast('🌙 Jest noc – poczekaj do rana.');return}if(scene!=='world'){scene='world';fade=1;crit.length=0}toy.type=null;cat.tx=null;cat.pending=null;cat.x=L.x;cat.y=420;camX=clamp(cat.x-visW/2,0,WORLD_W-visW);updateBar()}

 S.needs.energy-=1.0*dt;if(S.needs.energy<4){toy.type=null;toast('Kot jest zmęczony – koniec zabawy 😴');updateBar();return}
 const lo=Math.max(40,scene==='home'?40:camX+40),hi=Math.min(sceneW()-40,camX+visW-40);
 if(t==='laser'||t==='rod'){toy.x=clamp(ptr.x,40,sceneW()-40);toy.y=clamp(ptr.y,BAND0,BAND1);tg=toy;if(t==='rod')cat.arriveR=34;

  const d=dist(cat.x,cat.y,toy.x,toy.y);if(d<220&&cat.moving){need('fun',3*dt);need('happy',1.2*dt);xpAcc+=1.2*mult('laser')*dt;playAcc+=dt;if(playAcc>8){playAcc=0;stat('plays')}}}
 else if(t==='mouse'){toy.t-=dt;if(toy.t<=0){toy.t=rnd(.4,1.1);const a=Math.random()*6.28,sp=rnd(60,130);toy.vx=Math.cos(a)*sp;toy.vy=Math.sin(a)*sp*.5}
  const d=dist(cat.x,cat.y,toy.x,toy.y);if(d<130){const a=Math.atan2(toy.y-cat.y,toy.x-cat.x);toy.vx=Math.cos(a)*175;toy.vy=Math.sin(a)*100}
  toy.x+=toy.vx*dt;toy.y+=toy.vy*dt;if(toy.x<lo||toy.x>hi){toy.vx*=-1;toy.x=clamp(toy.x,lo,hi)}if(toy.y<BAND0||toy.y>BAND1){toy.vy*=-1;toy.y=clamp(toy.y,BAND0,BAND1)}
  tg=toy;if(d<28){need('fun',16);need('happy',5);addXP(8*mult('mouse'));stat('plays');fx(toy.x,toy.y-20,'⭐',3);sfx('pop');if(Math.random()<.3)addCoins(1+Math.floor(Math.random()*3));
   toy.x=clamp(cat.x+rnd(-300,300),lo,hi);toy.y=rnd(BAND0,BAND1)}}
 else if(t==='ball'){if(toy.held){toy.x=cat.x+cat.dir*22;toy.y=cat.y;toy.z=22}else{toy.x+=toy.vx*dt;toy.y+=toy.vy*dt;const f=Math.exp(-1.8*dt);toy.vx*=f;toy.vy*=f;toy.vz-=900*dt;toy.z+=toy.vz*dt;if(toy.z<0){toy.z=0;toy.vz*=-.5;if(Math.abs(toy.vz)<40)toy.vz=0}
   if(toy.x<40||toy.x>sceneW()-40){toy.vx*=-.7;toy.x=clamp(toy.x,40,sceneW()-40)}if(toy.y<BAND0||toy.y>BAND1){toy.vy*=-.7;toy.y=clamp(toy.y,BAND0,BAND1)}
   tg=toy;if(dist(cat.x,cat.y,toy.x,toy.y)<26&&toy.z<26){toy.held=true;need('fun',9);need('happy',3);addXP(6*mult('ball'));stat('plays');fx(cat.x,cat.y-50,'⭐',3);sfx('pop')}}}
 else if(t==='hide'){toy.search-=dt;const un=toy.hidden;if(un.length&&toy.search<=0){let b=un[0];un.forEach(h=>{if(dist(cat.x,cat.y,h.x,h.y)<dist(cat.x,cat.y,b.x,b.y))b=h});tg=b;cat.arriveR=14;
   if(dist(cat.x,cat.y,b.x,b.y)<26){un.splice(un.indexOf(b),1);need('hunger',8);need('fun',10);need('happy',3);addXP(10);stat('plays');fx(b.x,b.y-20,'🍬',3);sfx('eat');if(!un.length){toy.type=null;toast('Wszystkie przysmaki znalezione! 🍬');updateBar()}}}}
 if(tg){cat.tx=tg.x;cat.ty=tg.y;cat.chase=true;cat.pending=null}}

function updateNeeds(dt){const n=S.needs,sl=cat.act&&cat.act.type==='sleep',mv=cat.moving?1.6:1;
 n.hunger=clamp(n.hunger-(sl?.04:.12)*dt*mv,0,100);n.thirst=clamp(n.thirst-(sl?.05:.15)*dt*mv,0,100);n.fun=clamp(n.fun-(sl?0:.1)*dt,0,100);
 n.hygiene=clamp(n.hygiene-.04*dt,0,100);n.toilet=clamp(n.toilet+(sl?.02:.06)*dt,0,100);
 if(!sl)n.energy=clamp(n.energy-.07*dt*mv,0,100);
 if(scene==='world'&&S.weather==='rain'){n.hygiene=clamp(n.hygiene-.15*dt,0,100);n.happy=clamp(n.happy-.08*dt,0,100)}
 if(scene==='world'&&isNight())n.happy=clamp(n.happy-.1*dt,0,100);
 const avg=(n.hunger+n.thirst+n.fun+n.energy+n.hygiene+(100-n.toilet))/6;n.happy=clamp(n.happy+(avg-n.happy)*.02*dt,0,100);
 const low=[n.hunger,n.thirst,n.fun,n.energy,n.hygiene].some(v=>v<15);if(low)n.happy=clamp(n.happy-.3*dt,0,100);
 if(n.toilet>=100){n.toilet=40;need('hygiene',-20);need('happy',-15);toast('😿 Wypadek… kot nie zdążył do kuwety!');fx(cat.x,cat.y-20,'💦',4)}
 if(n.energy<8&&!cat.act&&!toy.type){startAct('sleep',{wake:40});toast('😴 Kot zasnął ze zmęczenia')}
 warnT-=dt;if(warnT<=0){warnT=22;const m=[['hunger','🍗 Jestem głodny!'],['thirst','💧 Chce mi się pić!'],['fun','🎾 Pobaw się ze mną!'],['energy','😴 Chce mi się spać…'],['hygiene','🧼 Jestem brudny…']];
  let w=null,wv=22;m.forEach(([k,t])=>{if(n[k]<wv){wv=n[k];w=t}});if(n.toilet>75&&!w)w='🚽 Muszę do kuwety!';if(w&&!cat.act)say(w,true)}}
function updateTime(dt){S.time+=dt*24/DAY_LEN;if(S.time>=24){S.time-=24;S.day++;stat('days');const e=evOf(S.day);toast('📅 Dzień '+S.day+(e.length?' – '+e.map(x=>x.i+' '+x.n).join(', '):''),3500);save()}
 updateTimeConcertHooks();const p=phase();if(p!==lastPhase){if(lastPhase){const m={Rano:'🌅 Rano – kot się budzi.',Południe:'☀️ Południe – można eksplorować świat.',Wieczór:'🌇 Wieczór – pora wracać do domu.',Noc:'🌙 Noc – kot może spać.'};toast(m[p],3200);
  if(p==='Noc'&&scene==='home'&&!cat.act&&!toy.type){goTo(HOME_I[3])}}lastPhase=p}
 if(cat.act&&cat.act.type==='sleep'&&p==='Rano'&&S.needs.energy>=60)wake();
 wxT-=dt;if(wxT<=0){wxT=rnd(70,140);const r=Math.random(),old=S.weather;S.weather=r<.55?'clear':r<.8?'cloudy':'rain';if(S.weather==='rain'&&old!=='rain')toast('🌧️ Zaczął padać deszcz');if(S.weather==='clear'&&old==='rain')toast('🌤️ Deszcz ustał')}}
function updateEvents(dt){evT-=dt;if(evT>0)return;evT=rnd(45,100);const o=scene==='world'?['butterfly','coin','coin']:['mouse','coin'];if(S.weather==='rain')o.push('storm');
 const e=o[Math.floor(Math.random()*o.length)],lo=scene==='home'?60:Math.max(60,camX+60),hi=Math.min(sceneW()-60,scene==='home'?sceneW()-60:camX+visW-60);
 if(e==='butterfly'){crit.push({k:'butterfly',x:clamp(cat.x+rnd(-250,250),lo,hi),y:rnd(BAND0,BAND1),a:rnd(0,6),life:25});toast('🦋 Motyl! Złap go!')}
 else if(e==='mouse'){crit.push({k:'mouse',x:clamp(cat.x+rnd(-300,300),lo,hi),y:rnd(BAND0+10,BAND1),vx:0,vy:0,t:0,life:22});toast('🐭 Mysz w domu! Łap ją!')}
 else if(e==='coin'){crit.push({k:'coin',x:clamp(cat.x+rnd(-300,300),lo,hi),y:rnd(BAND0+10,BAND1),life:40});toast('🪙 Coś błyszczy na ziemi!')}
 else if(e==='storm'){flash=1;sfx('splash');need('happy',-5);toast('⚡ Grzmot! Kot się wystraszył.')}}
function updateCrit(dt){for(let i=crit.length-1;i>=0;i--){const c=crit[i];c.life-=dt;if(c.k==='butterfly'){c.a+=dt*2;c.x+=Math.cos(c.a*1.3)*50*dt;c.y=clamp(c.y+Math.sin(c.a)*30*dt,BAND0,BAND1)}
 if(c.k==='mouse'){c.t-=dt;if(c.t<=0){c.t=rnd(.4,1);const a=Math.random()*6.28;c.vx=Math.cos(a)*90;c.vy=Math.sin(a)*50}const d=dist(cat.x,cat.y,c.x,c.y);if(d<110){const a=Math.atan2(c.y-cat.y,c.x-cat.x);c.vx=Math.cos(a)*140;c.vy=Math.sin(a)*80}
  c.x=clamp(c.x+c.vx*dt,40,sceneW()-40);c.y=clamp(c.y+c.vy*dt,BAND0,BAND1)}
 if(dist(cat.x,cat.y,c.x,c.y)<30&&!(cat.act&&cat.act.type==='sleep')){if(c.k==='coin'){addCoins(5+Math.floor(Math.random()*11));fx(c.x,c.y-20,'🪙',3)}else{need('fun',12);need('happy',4);addXP(8);stat('plays');addCoins(3);fx(c.x,c.y-30,'⭐',4);sfx('pop')}crit.splice(i,1);continue}
 if(c.life<=0)crit.splice(i,1)}}
function updateCat(dt){cat.anim+=dt;cat.blink-=dt;if(cat.blink<-3.5)cat.blink=.13;cat.petCool-=dt;cat.poseT-=dt;if(cat.bubble){cat.bubble.t-=dt;if(cat.bubble.t<=0)cat.bubble=null}
 if(cs.on){cat.act=null;cat.tx=null;cat.pending=null;cat.moving=true;return}
 const mx=keys.right-keys.left+joy.x,my=keys.down-keys.up+joy.y,mag=Math.hypot(mx,my),manual=mag>.25;
 if(cat.act){const a=cat.act,A=ACT[a.type];a.t+=dt;cat.moving=false;
  if(manual&&a.type==='sleep'){wake()}
  else if(a.type==='sleep'){const bm=S.equip.bed==='bed3'?2.4:S.equip.bed==='bed2'?1.7:1.2;S.needs.energy=clamp(S.needs.energy+2*bm*dt,0,100);a.fx-=dt;if(a.fx<=0){a.fx=1.3;fx(cat.x+20,cat.y-40,'💤',1)}
   if(S.needs.energy>=(a.wake||100)||S.needs.hunger<4){const wk=a.wake;cat.act=null;say(S.needs.energy>=95?'Wyspany! 😸':'Miau…',true)}}
  else{if(a.type==='pet'||a.type==='hug'){a.fx-=dt;if(a.fx<=0){a.fx=.35;fx(cat.x,cat.y-60,'💕',1)}}if(a.t>=a.dur){cat.act=null;A.done(a)}}
  return}
 let sp=(cat.chase?215:150)*(S.needs.energy<15?.7:1),moved=false,tvx=0;
 if(manual){cat.tx=null;cat.pending=null;const k=mag>1?1/mag:1;cat.x+=mx*k*sp*dt;cat.y+=my*k*sp*.8*dt;if(Math.abs(mx)>.1)cat.dir=mx>0?1:-1;moved=true}
 else if(cat.tx!==null){const dx=cat.tx-cat.x,dy=cat.ty-cat.y,d=Math.hypot(dx,dy),stop=cat.pending?cat.pending.r:cat.arriveR;
  if(d<=stop){if(cat.pending){const p=cat.pending;cat.pending=null;cat.tx=null;useIt(p)}else if(!cat.chase)cat.tx=null}
  else{const st=Math.min(d-.01,sp*dt);cat.x+=dx/d*st;cat.y+=dy/d*st*.85;if(Math.abs(dx)>1)cat.dir=dx>0?1:-1;moved=true}}
 const hi=sceneW()-24;cat.x=clamp(cat.x,24,hi);cat.y=clamp(cat.y,BAND0,BAND1);cat.moving=moved;cat.arriveR=6;
 if(!cat.act&&!moved&&!manual&&cat.tx===null&&!cat.pending&&!toy.type){
  const c=crit.find(q=>q.k!=='coin'&&dist(q.x,q.y,cat.x,cat.y)<500);
  if(c){cat.tx=c.x;cat.ty=c.y;cat.chase=true;cat.arriveR=10;return}
  cat.idleT-=dt;if(cat.idleT<=0){cat.idleT=rnd(2.5,6);idleAI()}}}
function idleAI(){const r=Math.random(),n=S.needs;
 if(n.energy<35&&r<.25)startAct('sleep',{wake:Math.min(100,n.energy+30)});

function mpOpen(code,host){
 if(typeof Peer==='undefined'){mpStatus('Brak internetu – multiplayer niedostępny.');return}
 code=String(code||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16);
 if(code.length<3){mpStatus('Nazwa serwera: min. 3 litery/cyfry.');return}
 mpClose();MP.code=code;MP.host=host;mpStatus('Łączenie…');
 const pid='catworld-'+code,p=MP.peer=host?new Peer(pid):new Peer();
 p.on('error',e=>{const t=e&&e.type;mpStatus(t==='unavailable-id'?'Serwer o tej nazwie już istnieje – wybierz inną.':t==='peer-unavailable'?'Nie znaleziono serwera "'+code+'".':'Błąd sieci: '+t);if(MP.peer===p&&!MP.on)mpClose()});

  if(host){MP.on=true;toast('🖥️ Serwer "'+code+'" działa!');mpRefresh()}
  else{const c=p.connect(pid,{reliable:true});MP.hostConn=c;
   c.on('open',()=>{MP.on=true;toast('🌐 Połączono z serwerem "'+code+'"');mpRefresh()});
   c.on('data',d=>mpData(d,c));
   c.on('close',()=>{if(MP.peer===p){mpClose();toast('🌐 Serwer został zamknięty');mpStatus('Rozłączono.');mpRefresh()}})}});
 if(host)p.on('connection',c=>{c.on('open',()=>{MP.conns.push(c);toast('🐾 Dołączył nowy gracz!');mpRefresh()});c.on('data',d=>mpData(d,c));
  c.on('close',()=>{MP.conns=MP.conns.filter(x=>x!==c);delete MP.others[c.peer];mpRefresh()})});
 setTimeout(()=>{if(MP.peer===p&&!MP.on){mpStatus('Nie udało się połączyć. Sprawdź nazwę serwera.');mpClose()}},12000)}

 if(MP.host){const all={host:me};for(const id in MP.others){const o=MP.others[id];all[id]={n:o.n,b:o.b,s:o.s,st:o.st,x:o.tx,y:o.ty,d:o.d,sc:o.sc,ih:o.ih,po:o.po,mv:o.mv,a:o.a}}

window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='text')return;const k=KM[e.code];if(k&&running&&!panelOpen){keys[k]=1;e.preventDefault()}
 if((e.code==='KeyE'||e.code==='Space'||e.code==='Enter')&&running&&!panelOpen){e.preventDefault();G.ctx()}
 if(e.code==='Escape'){if(panelOpen){if($('#pback').style.visibility!=='hidden')G.back();else G.closeP()}else if(running)openPause()}});
window.addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
(function(){const j=$('#joy'),kn=j.querySelector('i');let id=null;const R=40;
 function mv(e){const r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}kn.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R;joy.y=dy/R}
 function end(){id=null;joy.x=joy.y=0;kn.style.transform=''}
 j.addEventListener('pointerdown',e=>{id=e.pointerId;j.setPointerCapture(id);mv(e);e.preventDefault()});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end)})();
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);scl=Math.min(innerHeight/VH,innerWidth/400);visW=innerWidth/scl;visH=innerHeight/scl;oy=(innerHeight-70)/(2*scl)-360}
window.addEventListener('resize',resize);resize();
window.addEventListener('pagehide',()=>{if(running)save()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)save()});
document.addEventListener('contextmenu',e=>e.preventDefault());
buildBar();$('#mcont').disabled=!hasSave;$('#wint').textContent=wintTxt();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(running)mpTick(dt);if(running&&!panelOpen){update(dt);uiT+=dt;if(uiT>.2){uiT=0;updateHud()}}
 if(running||!$('#main').classList.contains('off')===false){render()}requestAnimationFrame(loop)}
setInterval(()=>{if(running&&!panelOpen)save()},15000);
requestAnimationFrame(loop);
</script>
</body>
</html>
